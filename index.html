<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Structured CV</title>
  <meta name="description" content="Structured bilingual CV template with URL parameter controls.">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand-logo" href="./" aria-label="Home">
      <svg width="42" height="42" viewBox="0 0 114 114" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="13" y="13" width="88" height="88" rx="18" fill="white" stroke="#323232" stroke-width="5"></rect>
        <path d="M26 34L38 78L50 50L62 78L74 34" stroke="#323232" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M68 34L84 52L100 34" stroke="#323232" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M84 52V80" stroke="#323232" stroke-width="7" stroke-linecap="round"></path>
        <circle cx="84" cy="52" r="4" fill="#323232"></circle>
      </svg>
    </a>
    <nav class="top-actions">
      <div id="lang-toggle-group" class="lang-toggle" aria-label="Language" data-tooltip="언어">
        <button id="lang-ko" class="lang-option" type="button" data-lang="ko">한</button>
        <button id="lang-en" class="lang-option" type="button" data-lang="en">EN</button>
      </div>
      <button id="share-action" class="icon-action" type="button" aria-label="Share" data-tooltip="공유">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#828282" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6"></path>
          <path d="M11 13l9 -9"></path>
          <path d="M15 4h5v5"></path>
        </svg>
      </button>
      <button id="print-action" class="icon-action" type="button" aria-label="Print" data-tooltip="인쇄">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#828282" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 17h2a2 2 0 0 0 2 -2v-4a2 2 0 0 0 -2 -2h-14a2 2 0 0 0 -2 2v4a2 2 0 0 0 2 2h2"></path>
          <path d="M17 9v-4a2 2 0 0 0 -2 -2h-6a2 2 0 0 0 -2 2v4"></path>
          <path d="M7 15a2 2 0 0 1 2 -2h6a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2z"></path>
        </svg>
      </button>
      <button id="settings-action" class="icon-action" type="button" aria-label="Settings" data-tooltip="설정">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#828282" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15a3 3 0 1 0 0 -6a3 3 0 0 0 0 6z"></path>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06 .06a2 2 0 1 1 -2.83 2.83l-.06 -.06a1.65 1.65 0 0 0 -1.82 -.33a1.65 1.65 0 0 0 -1 1.51v.17a2 2 0 1 1 -4 0v-.1a1.65 1.65 0 0 0 -1.08 -1.54a1.65 1.65 0 0 0 -1.82 .33l-.06 .06a2 2 0 1 1 -2.83 -2.83l.06 -.06a1.65 1.65 0 0 0 .33 -1.82a1.65 1.65 0 0 0 -1.51 -1h-.17a2 2 0 1 1 0 -4h.1a1.65 1.65 0 0 0 1.54 -1.08a1.65 1.65 0 0 0 -.33 -1.82l-.06 -.06a2 2 0 1 1 2.83 -2.83l.06 .06a1.65 1.65 0 0 0 1.82 .33h.08a1.65 1.65 0 0 0 1 -1.51v-.17a2 2 0 1 1 4 0v.1a1.65 1.65 0 0 0 1.08 1.54a1.65 1.65 0 0 0 1.82 -.33l.06 -.06a2 2 0 1 1 2.83 2.83l-.06 .06a1.65 1.65 0 0 0 -.33 1.82v.08a1.65 1.65 0 0 0 1.51 1h.17a2 2 0 1 1 0 4h-.1a1.65 1.65 0 0 0 -1.54 1.08z"></path>
        </svg>
      </button>
    </nav>
  </header>

  <main id="app" class="layout" aria-live="polite"></main>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
